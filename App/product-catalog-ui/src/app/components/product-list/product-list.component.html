<div class="container">
  <h2>Каталог товаров</h2>

  <button (click)="loadProducts()">Обновить</button>

  <div *ngIf="loading">Загрузка...</div>

  <table *ngIf="!loading">
    <thead>
      <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Количество</th>
        <th>Дата добавления</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>{{ product.price | currency:'RUB':'symbol':'1.2-2' }}</td>
        <td>{{ product.quantity }}</td>
        <td>{{ product.dateAdded | date:'dd.MM.yyyy HH:mm' }}</td>
      </tr>
    </tbody>
  </table>
</div>
